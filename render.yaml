# Render Blueprint: New → Blueprint → pick this repo. Fill the "sync: false" values when asked.
databases:
  - name: latif-db
    databaseName: latif_kids
    user: latif
    plan: basic-256mb

services:
  - type: web
    name: latif-api
    runtime: docker
    dockerContext: .
    dockerfilePath: apps/api/Dockerfile
    plan: starter
    healthCheckPath: /api/v1/health
    disk:
      name: uploads
      mountPath: /app/storage
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_PORT
        value: '10000'
      - key: DATABASE_URL
        fromDatabase: { name: latif-db, property: connectionString }
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: STORAGE_DRIVER
        value: local
      - key: STORAGE_LOCAL_DIR
        value: /app/storage
      - key: AUTH_DEV_LOGIN
        value: 'false'
      - key: CORS_ORIGINS
        sync: false # e.g. https://latif-web.onrender.com
      - key: GOOGLE_CLIENT_IDS
        sync: false
      - key: SUPER_ADMIN_EMAILS
        sync: false

  - type: web
    name: latif-web
    runtime: docker
    dockerContext: .
    dockerfilePath: apps/web/Dockerfile
    plan: starter
    envVars:
      - key: API_URL
        sync: false # e.g. https://latif-api.onrender.com/api/v1
      - key: NEXT_PUBLIC_GOOGLE_CLIENT_ID
        sync: false
