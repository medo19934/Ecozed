# Builds the Latif Kids desktop app (Windows .exe, Mac .dmg) and attaches them to a GitHub release.
name: Desktop app

on:
  push:
    branches: [feat/desktop-app, claude/latif-kids-saas-setup-lbtxt1, main]
    paths:
      - 'desktop/**'
      - '.github/workflows/desktop.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: dist:win
            file: desktop/dist/*.exe
          # Mac zips are built on Linux (Mac runners queue/cancel on free private repos).
          - os: ubuntu-latest
            script: dist:mac-zip
            file: desktop/dist/*.zip
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        working-directory: desktop
        run: npm install --no-audit --no-fund
      - name: Build installer
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false' # unsigned (free); Windows/Mac show a one-time warning
        run: npm run ${{ matrix.script }}
      - uses: actions/upload-artifact@v4
        with:
          name: latif-kids-${{ matrix.os }}
          path: ${{ matrix.file }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-${{ github.run_number }}
          name: Latif Kids Desktop ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: false
          body: |
            **Windows:** download `latif-kids-setup-*.exe` → open → "More info" → "Run anyway" (first time only).
            **Mac:** download `latif-kids-mac-arm64.zip` (Apple M1–M4) or `latif-kids-mac-x64.zip` (Intel) → unzip → drag Latif Kids to Applications → right-click → Open (first time only).
            Connects to https://latif-kids.vercel.app — needs internet.
          files: out/*
