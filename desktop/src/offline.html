<!doctype html>
<html lang="ar" dir="rtl">
<head><meta charset="utf-8"><title>Latif Kids</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<style>
  body{margin:0;height:100vh;display:grid;place-items:center;background:#f2f4f5;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;color:#1f2433}
  .card{background:#fff;border-radius:20px;padding:40px 48px;text-align:center;box-shadow:0 10px 40px #1f24331a;max-width:440px}
  h1{margin:0 0 10px;font-size:24px}p{margin:0 0 24px;color:#5d6478;line-height:1.7}
  button{border:0;border-radius:14px;padding:12px 30px;font-size:16px;font-weight:600;color:#fff;cursor:pointer;background:linear-gradient(135deg,#5b6db4,#7b649b)}
</style></head>
<body><div class="card">
  <h1>لا يوجد اتصال بالإنترنت</h1>
  <p>تحتاج لطيف كيدز إلى الإنترنت لعرض بيانات الحضانة. تحقق من الاتصال ثم أعد المحاولة.<br><small>No internet connection — check it and try again.</small></p>
  <button id="retry">إعادة المحاولة</button>
</div>
<script>
  const back = new URLSearchParams(location.search).get('back') || 'https://latif-kids.vercel.app/ar/login';
  const go = () => { location.href = back; };
  document.getElementById('retry').onclick = go;
  window.addEventListener('online', go);
</script>
</body></html>
